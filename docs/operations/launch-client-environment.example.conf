# Engage Core new-environment launch configuration
#
# Copy this file OUTSIDE the repository or to another operator-owned location,
# populate only non-secret deployment values, then run:
#
#   bash scripts/operations/launch-client-environment.sh prepare /path/to/client.conf
#   # populate secrets manually in root/client .env files
#   bash scripts/operations/launch-client-environment.sh install /path/to/client.conf
#   # configure DNS/Nginx/SSL manually
#   bash scripts/operations/launch-client-environment.sh runtime /path/to/client.conf
#   bash scripts/operations/launch-client-environment.sh verify /path/to/client.conf
#
# DO NOT put passwords, signing secrets, API keys, private keys, or access tokens
# in this file. The script deliberately leaves those values for manual env setup.

################################
# ENVIRONMENT / CLIENT
################################

DEPLOY_ENV=staging
CLIENT_KEY=example-client
ROOT_DOMAIN=staging.example.com
CORE_ADMIN_HOST=app.staging.example.com

# Engage Core checkout that already contains this launch script.
APP_PATH=/var/www/staging.example.com/engage-core

################################
# SOURCE REVISIONS
################################

CORE_BRANCH=main
CLIENT_BRANCH=main

# Optional. Used only when client/<CLIENT_KEY> does not already exist.
CLIENT_REPO_URL=git@github.com:ExampleOrg/example-client.git

################################
# PROCESS IDENTITIES
################################

DEPLOY_USER=deploy
WEB_USER=www-data
WEB_GROUP=www-data
SCHEDULER_USER=deploy
PHP_BIN=/usr/bin/php8.3
PHP_FPM_SERVICE=php8.3-fpm

################################
# DATABASE — NON-SECRET PORTION
################################

DB_CONNECTION=mysql
DB_HOST=127.0.0.1
DB_PORT=3306
DB_DATABASE=engage_core_example_staging
DB_USERNAME=engage_core_example
# DB_PASSWORD is intentionally NOT accepted here. Populate client .env manually.

################################
# REDIS / RUNTIME NAMESPACES
################################

REDIS_HOST=127.0.0.1
REDIS_PORT=6379
REDIS_DB=0
REDIS_CACHE_DB=1

# Stable, explicit prefix stem. Use only letters/numbers/underscores when practical.
RUNTIME_PREFIX=example_client_staging

################################
# HORIZON / SCHEDULER
################################

HORIZON_PROGRAM=example-client-horizon
HORIZON_PRIMARY_QUEUES=default,notifications,confirmation_messages,opt_in_messages,reminders,post_event,marketing,emails,sms,webinars,webhooks

################################
# ROOT/PROCESS DEFAULTS
################################

FILESYSTEM_DISK=spaces
LOG_CHANNEL=stack
LOG_STACK=daily_json
LOG_LEVEL=info
LOG_DAILY_DAYS=14

################################
# OPTIONAL URL SURFACES
################################

# Leave blank when the selected client does not expose these Core surfaces.
WEBINAR_APP_URL=
SCHEDULING_APP_URL=

################################
# OPTIONAL EXTERNAL FORMS INTAKE
################################

FORMS_EXTERNAL_INTAKE_ENABLED=false
FORMS_EXTERNAL_INTAKE_CLIENT_ID=engage_sites
FORMS_EXTERNAL_INTAKE_SOURCE=engage_sites
FORMS_EXTERNAL_INTAKE_PROVIDER=engage_sites
FORMS_EXTERNAL_INTAKE_ALLOWED_FORMS=artist_updates
FORMS_EXTERNAL_INTAKE_DOMAINS=staging.example.com

# Used only by the safe unsigned HTTP smoke in the verify phase.
FORMS_SMOKE_FORM_KEY=artist_updates

################################
# VERIFY PHASE
################################

# Set to 1 only after DNS, Nginx, and TLS are configured for CORE_ADMIN_HOST and
# webhooks.<ROOT_DOMAIN>.
HTTP_SMOKE=0