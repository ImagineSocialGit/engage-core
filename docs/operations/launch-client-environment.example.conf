# Legacy compatibility note
# =========================
#
# The Core launcher no longer consumes an operator-maintained .conf file.
# Operational names, runtime prefixes, Supervisor/Horizon program names, app paths,
# and queue inventories are derived by the launcher/application contracts instead.
#
# Start a new interactive deployment with:
#
#   bash scripts/operations/launch-client-environment.sh new
#
# Or provide only the stable launch identity up front:
#
#   bash scripts/operations/launch-client-environment.sh new \
#     --environment production \
#     --client-repo git@github.com:ImagineSocialGit/example-client-crm.git \
#     --root-domain example.com \
#     --topology core_services_only
#
# The launcher writes a non-secret resumable JSON state file under:
#
#   ~/.local/state/engage/deployments/
#
# Secrets are prompted with hidden input and written directly to the correct root
# or selected-client runtime .env file. Do not create a replacement config file
# containing passwords, API keys, signing secrets, or access tokens.
